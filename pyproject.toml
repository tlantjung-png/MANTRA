# Package manifest: backend, entry points, test discovery.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantra"
version = "0.1.0"
description = "Modular harness for coding agents"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mantra = "core.console:main"
mantra-headless = "core.main:main"

[tool.setuptools]
packages = ["core", "core.agent", "core.tools", "core.tui"]
include-package-data = true

[tool.setuptools.data-files]
"examples" = ["examples/*.json"]
"knowledge" = ["knowledge/*.md"]
"rules" = ["rules/*.rules"]
"skills" = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
