# Package manifest: backend, entry points, test discovery.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mantra"
version = "3.1.3"
description = "Modular harness for coding agents"
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["defusedxml>=0.7"]

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
test = ["pytest>=7"]

[project.scripts]
mantra = "core.console:main"
mantra-headless = "core.main:main"

[tool.setuptools]
packages = ["core", "core.agent", "core.mcp", "core.tools", "core.tui"]
include-package-data = true

[tool.setuptools.data-files]
"examples" = ["examples/*.json"]
"knowledge" = ["knowledge/*.md"]
"rules" = ["rules/*.rules"]
# data-files installs each matched file by basename into its key's folder.
# A single skills-wide glob would collapse all skill manifests into one
# SKILL.md, so every skill needs its own destination key.
"skills" = ["skills/INDEX.md"]
"skills/adopt-workspace" = ["skills/adopt-workspace/SKILL.md"]
"skills/analytics" = ["skills/analytics/SKILL.md"]
